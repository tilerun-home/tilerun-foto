    <rect x="-120" y="402" width="1080" height="150" rx="34" fill="url(#goldGrad)" transform="rotate(-45 384 384)"/>
    <rect x="-28" y="516" width="1080" height="164" rx="36" fill="url(#sageGrad)" transform="rotate(-45 384 384)"/>
    <rect x="100" y="640" width="1080" height="176" rx="38" fill="url(#greenGrad)" transform="rotate(-45 384 384)"/>

  </g>
  <rect x="6" y="6" width="756" height="756" rx="199" fill="none" stroke="#325745" stroke-opacity="0.42" stroke-width="12"/>
  <rect x="14" y="14" width="740" height="740" rx="191" fill="none" stroke="#FFFFFF" stroke-opacity="0.20" stroke-width="10"/>
  <g fill="none" stroke="#274637" stroke-opacity="0.16" stroke-linecap="round" stroke-linejoin="round">
    <rect x="170" y="206" width="432" height="336" rx="46" stroke-width="44"/>

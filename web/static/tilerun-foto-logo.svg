<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="768" height="768" viewBox="0 0 768 768" role="img" aria-labelledby="title desc">
  <title id="title">TileRun Foto-logo</title>
  <desc id="desc">TileRun Foto-pictogram met zand-, goud-, salie- en groentinten en een wit fotosymbool.</desc>
  <defs>
    <clipPath id="tileClip"><rect width="768" height="768" rx="205"/></clipPath>
    <linearGradient id="sandGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ECE3D1"/><stop offset="1" stop-color="#D9CCB1"/></linearGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#C1A14A"/><stop offset="1" stop-color="#9E8136"/></linearGradient>
    <linearGradient id="sageGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#98B69D"/><stop offset="1" stop-color="#739A7F"/></linearGradient>
    <linearGradient id="greenGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4E8466"/><stop offset="1" stop-color="#35634E"/></linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF" stop-opacity="0.12"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0.02"/></linearGradient>
  </defs>
  <g clip-path="url(#tileClip)">
